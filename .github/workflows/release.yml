name: Release

# Builds the api, frontend and proxy images on every change to main that
# reaches them, pushes them to GHCR (latest and the commit) and asks
# Coolify to redeploy. The api and frontend builds share the layer cache
# CI's warm-cache job fills.
on:
  push:
    # rust: temporary, so the rewrite's images exist before the merge.
    # Goes away when rust is merged into main.
    branches: [main, rust]
    paths:
      - "src/**"
      - "migrations/**"
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - Dockerfile
      - .dockerignore
      - "frontend/**"
      - "deploy/**"
      - compose.prod.yml
      - .github/workflows/release.yml
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            context: .
          - service: frontend
            context: frontend
          - service: proxy
            context: deploy
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/eve-telescope/telescope-${{ matrix.service }}:latest
            ghcr.io/eve-telescope/telescope-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    name: Deploy
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Coolify webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "COOLIFY_WEBHOOK or COOLIFY_TOKEN not set, skipping the deploy"
            exit 0
          fi
          curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
