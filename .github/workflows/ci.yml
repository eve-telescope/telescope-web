name: CI

# Pull requests and the merge queue only, and only the jobs a change can
# affect. Pushes to main just keep the build caches warm, so pull requests
# start from them (GitHub shares caches from the base branch only).
on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - rust-toolchain.toml
      - Dockerfile
      - frontend/Dockerfile
      - frontend/package-lock.json
      - .github/workflows/ci.yml

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changes
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      stack: ${{ steps.filter.outputs.stack }}
      proxy: ${{ steps.filter.outputs.proxy }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            workflow: &workflow
              - .github/workflows/ci.yml
            rust:
              - *workflow
              - "src/**"
              - "tests/**"
              - "migrations/**"
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
            frontend:
              - *workflow
              - "frontend/**"
            stack:
              - *workflow
              - "src/**"
              - "migrations/**"
              - "frontend/**"
              - Cargo.toml
              - Cargo.lock
              - Dockerfile
              - docker-compose.yml
              - "deploy/**"
            proxy:
              - *workflow
              - "deploy/**"

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The suites create and migrate their own `telescope_test` database.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/telescope_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/telescope
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --locked

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      # The vitest suites run in a real browser.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Types
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Test
        run: npm test

  # The production proxy image builds and its Caddyfile parses.
  proxy:
    name: Proxy
    needs: changes
    if: needs.changes.outputs.proxy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t proxy deploy
      - name: Validate the Caddyfile
        run: docker run --rm proxy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  e2e:
    name: End to end
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The images build from the layer cache main left behind, so a pull
      # request only compiles what it changed.
      - name: Build the images
        uses: docker/bake-action@v7
        with:
          files: docker-compose.yml
          targets: api,frontend
          load: true
          set: |
            api.tags=telescope-api
            frontend.tags=telescope-frontend
            api.cache-from=type=gha,scope=api
            frontend.cache-from=type=gha,scope=frontend
      - name: Start the stack
        run: |
          docker compose up -d --no-build
          timeout 120 sh -c 'until curl -fs http://localhost:5318/up >/dev/null; do sleep 2; done'
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        run: npm run test:e2e

  # Fills the caches on main whenever what they hold changes.
  warm-cache:
    name: Warm caches
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
      - name: Build
        run: cargo build --all-targets --locked
      - uses: docker/setup-buildx-action@v4
      - name: Build the images
        uses: docker/bake-action@v7
        with:
          files: docker-compose.yml
          targets: api,frontend
          set: |
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,scope=api,mode=max
            frontend.cache-from=type=gha,scope=frontend
            frontend.cache-to=type=gha,scope=frontend,mode=max

  # The one check to require: passes when every job a change needed passed,
  # skipped jobs included.
  ci:
    name: CI
    if: always() && github.event_name != 'push'
    needs: [changes, rust, frontend, proxy, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Result
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
